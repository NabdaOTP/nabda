# Nabda OTP — static site on Netlify
# https://docs.netlify.com/configure-builds/file-based-configuration/
#
# If the Git repo root is the parent folder, set Netlify "Base directory" to `nabda`.

[build]
  publish = "."
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Arabic locale URLs (200 rewrite — browser bar stays /ar/...)
[[redirects]]
  from = "/ar/about.html"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/ar/privacy-policy.html"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/ar/terms-of-service.html"
  to = "/terms-of-service.html"
  status = 200

[[redirects]]
  from = "/ar/refund-policy.html"
  to = "/refund-policy.html"
  status = 200

[[redirects]]
  from = "/ar/index.html"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/ar/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/ar"
  to = "/index.html"
  status = 200

# Turkish locale URLs (200 rewrite — browser bar stays /tr/...)
[[redirects]]
  from = "/tr/about.html"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/tr/privacy-policy.html"
  to = "/privacy-policy.html"
  status = 200

[[redirects]]
  from = "/tr/terms-of-service.html"
  to = "/terms-of-service.html"
  status = 200

[[redirects]]
  from = "/tr/refund-policy.html"
  to = "/refund-policy.html"
  status = 200

[[redirects]]
  from = "/tr/index.html"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tr/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/tr"
  to = "/index.html"
  status = 200

# Canonical home: avoid duplicate /index.html indexing
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Apex → www (HTTPS)
[[redirects]]
  from = "https://nabdaotp.com/*"
  to = "https://www.nabdaotp.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://nabdaotp.com/*"
  to = "https://www.nabdaotp.com/:splat"
  status = 301
  force = true

# Force HTTPS on www host
[[redirects]]
  from = "http://www.nabdaotp.com/*"
  to = "https://www.nabdaotp.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"
